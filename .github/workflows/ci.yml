name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        node: ['22.23.1', '24.18.0']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: aikdna/kdna-assets
          ref: 2dd1e2844fd8b8deff8ea0e2620fd946e5c9544f
          path: public-assets
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check-ci-boundary.js
      - run: npm run ci
      - name: Exercise the pinned Web Server with the published reference asset
        env:
          KDNA_WEB_CLIENT_ASSET: public-assets/references/public/laozi-wuwei/laozi-wuwei-0.1.1.kdna
        run: node scripts/run-web-server-integration-gate.mjs
      # The receipt generator is never trusted about its own verdict: this step re-derives
      # the leg's unavailability codes from the committed bytes, requires the receipt, the
      # registration and the recomputation to agree in both directions, and proves the
      # not_run disappears once its registered codes are gone.
      - name: Verify the CI leg receipt against the committed bytes
        env:
          KDNA_WEB_CLIENT_ASSET: public-assets/references/public/laozi-wuwei/laozi-wuwei-0.1.1.kdna
        run: node scripts/verify-ci-leg-receipts.mjs
